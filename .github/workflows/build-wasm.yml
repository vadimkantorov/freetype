name: build-wasm
on: workflow_dispatch
jobs:
  build-wasm:
    runs-on: ubuntu-26.04
    steps:
      - name: Install Prerequisites
        run:  sudo apt-get install -y automake autoconf 

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "6.0.6"

      - uses: actions/checkout@v4

      - name: Build wasm
        run: |
          bash autogen.sh

          #works
          #export CFLAGS="-sEXECUTABLE -sNODERAWFS -sFORCE_FILESYSTEM"
          #emconfigure ./configure
          #emmake make
          
          #works
          #emconfigure ./configure CFLAGS="-sEXECUTABLE -sNODERAWFS -sFORCE_FILESYSTEM"
          #emmake make
          
          #works
          #emconfigure ./configure
          #emmake make CCexe_CFLAGS="-sEXECUTABLE -sNODERAWFS -sFORCE_FILESYSTEM"
          
          #doesntwork
          #emconfigure ./configure
          #emmake make CFLAGS="-sEXECUTABLE -sNODERAWFS -sFORCE_FILESYSTEM"

          #doesntwork
          #emconfigure ./configure
          #emmake make CFLAGS_BUILD="-sEXECUTABLE -sNODERAWFS -sFORCE_FILESYSTEM"

          export CCexe_CFLAGS="-sEXECUTABLE -sNODERAWFS -sFORCE_FILESYSTEM"
          emconfigure ./configure
          emmake make 
