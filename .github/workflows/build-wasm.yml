name: build-wasm
on: workflow_dispatch
jobs:
  build-wasm:
    runs-on: ubuntu-26.04
    steps:
      - name: Install Prerequisites
        run:  sudo apt-get install -y automake autoconf 

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "6.0.6"

      - uses: actions/checkout@v4

      - name: Build wasm
        run: |
          bash autogen.sh

          #works
          #export CFLAGS="-sEXECUTABLE -sNODERAWFS"
          #emconfigure ./configure
          #emmake make
          
          #works
          #emconfigure ./configure CFLAGS="-sEXECUTABLE -sNODERAWFS"
          #emmake make
          
          #works
          #emconfigure ./configure
          #emmake make CCexe_CFLAGS="-sEXECUTABLE -sNODERAWFS"
          
          #doesntwork
          #emconfigure ./configure
          #emmake make CFLAGS="-sEXECUTABLE -sNODERAWFS"

          #doesntwork
          #emconfigure ./configure
          #emmake make CFLAGS_BUILD="-sEXECUTABLE -sNODERAWFS"

          #doesntwork
          #export CCexe_CFLAGS="-sEXECUTABLE -sNODERAWFS"
          #emconfigure ./configure
          #emmake make 

          #workswithpatch
          #emconfigure ./configure CC_BUILD=gcc
          #emmake make
          
          #workswithpatch
          #export CC_BUILD=gcc
          #emconfigure ./configure
          #emmake make
          
          #workswithpatch
          #emconfigure ./configure CFLAGS_BUILD="-sEXECUTABLE -sNODERAWFS"
          #emmake make 
          
          emconfigure ./configure --disable-shared
          emmake make
